# Dependabot configuration for zimlama/recon
# Auto-merge patch updates; review minor + major updates manually.

version: 2

updates:
  # GitHub Actions — keep on patch, review minor/major
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Backend pip dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Docker base images — track upstream base image updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
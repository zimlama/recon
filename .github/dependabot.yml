# Dependabot configuration for zimlama/recon
# Strategy: SILENCE PRs, KEEP security alerts.
# - open-pull-requests-limit: 0 stops Dependabot from opening PRs automatically
# - Security alerts remain enabled at the repo level (Settings → Code security)
# - When you want to update deps, raise the limit or trigger manually:
#   `gh api -X POST repos/zimlama/recon/dependabot/repository_updates` or
#   bump the limit temporarily in this file.

version: 2

updates:
  # GitHub Actions — keep on patch, review minor + major
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor:
        patterns:
          - "*"
        update-types:
          - "minor"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Backend pip dependencies
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 0
    groups:
      patch:
        patterns:
          - "*"
        update-types:
          - "patch"

  # Docker base images — track upstream base image updates
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
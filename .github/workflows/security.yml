# Security scanning workflow
# Runs on every PR and push to main/developer.
# Surfaces findings via GitHub Security tab (Code Scanning).
#
# Phase 1 scanners (advisory initially — tighten in Phase 2):
#   - gitleaks: secret detection (blocks on findings)
#   - bandit:  Python SAST (SARIF → Security tab, blocks on HIGH+ severity)
#   - pip-audit: backend dependency CVEs (advisory, upgrade to blocking Phase 2)
#   - npm audit: frontend dependency CVEs (advisory, upgrade to blocking Phase 2)
#   - trivy: filesystem + Dockerfile scan (SARIF → Security tab, blocks on HIGH+ severity)

name: security

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main, developer]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ---------- 1. Secret scanning ----------
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------- 2. Python SAST ----------
  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit==1.7.10

      - name: Run bandit (JSON → SARIF)
        run: |
          mkdir -p reports
          bandit -r backend/app/ \
                    -f json \
                    -o reports/bandit.json \
                    --severity-level medium \
                    --confidence-level medium \
                    --exit-zero || true
          # Convert bandit JSON to SARIF for GitHub Code Scanning
          python3 .github/scripts/bandit_to_sarif.py reports/bandit.json reports/bandit.sarif

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/bandit.sarif
          category: bandit

  # ---------- 3. Backend dependency CVE scan ----------
  pip-audit:
    name: pip-audit (backend deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Run pip-audit (advisory — Phase 1.5 residuals pending)
        working-directory: backend
        run: |
          pip-audit --strict --disable-pip \
                    --requirement requirements.txt \
                    --format json \
                    --output ../reports/pip-audit.json || true
          echo "::notice::pip-audit advisory. Residuals: aiohttp<3.14, starlette<0.40 (transitive). Tracked in follow-up issue."

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip-audit.json
          if-no-files-found: ignore

  # ---------- 4. Frontend dependency CVE scan ----------
  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (advisory — Phase 1.5 residuals pending)
        working-directory: frontend
        run: |
          mkdir -p ../reports
          npm audit --json --audit-level=high > ../reports/npm-audit.json 2>&1 || true
          echo "::notice::npm audit advisory. Residuals: axios<1.20, next<16.4, vitest<1.6.1, playwright<1.64, unfixable tailwindcss transitives. Tracked in follow-up issue."

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: reports/npm-audit.json
          if-no-files-found: ignore

  # ---------- 5. Filesystem + Dockerfile vulnerability scan ----------
  trivy:
    name: trivy (filesystem + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run trivy filesystem scan (advisory — Phase 1.5 residuals pending)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "reports/trivy-fs.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"
          hide-progress: true
        # exit-code: "0" = advisory. Phase 1.5 #31/#32 cleared the original
        # 100 CVEs but residuals remain (axios<1.20, next<16.4, aiohttp<3.14,
        # unfixable tailwindcss transitives). Tracked in follow-up issue.
        # Will be flipped to exit-code: "1" once residuals=0.

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-fs

      # NOTE: image scans (backend/Dockerfile, frontend/Dockerfile) deferred to
      # Phase 1.5. They need a working Docker build context inside the runner
      # which requires docker/setup-buildx-action + a more complex workflow.
      # The filesystem scan above already catches Dockerfile misconfigs and
      # lockfile-based dep CVEs (the highest-leverage surfaces).
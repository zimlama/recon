# Security scanning workflow
# Runs on every PR and push to main/developer.
# Surfaces findings via GitHub Security tab (Code Scanning).
#
# Phase 1 scanners (advisory initially — tighten in Phase 2):
#   - gitleaks: secret detection (blocks on findings)
#   - bandit:  Python SAST (SARIF → Security tab, blocks on HIGH+ severity)
#   - pip-audit: backend dependency CVEs (blocking since PR-G1 — pip-audit CLEAN post-Phase 1.5 PR-B)
#   - npm audit: frontend dependency CVEs (blocking since PR-G2 — critical-only via audit-ci allowlist)
#   - trivy: filesystem + Dockerfile scan (blocking since PR-G2 — HIGH+CRITICAL via .trivyignore allowlist)

name: security

on:
  pull_request:
    branches: [main, developer]
  push:
    branches: [main, developer]

permissions:
  contents: read
  security-events: write
  pull-requests: read

jobs:
  # ---------- 1. Secret scanning ----------
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  # ---------- 2. Python SAST ----------
  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bandit
        run: pip install bandit==1.7.10

      - name: Run bandit (JSON → SARIF)
        run: |
          mkdir -p reports
          bandit -r backend/app/ \
                    -f json \
                    -o reports/bandit.json \
                    --severity-level medium \
                    --confidence-level medium \
                    --exit-zero || true
          # Convert bandit JSON to SARIF for GitHub Code Scanning
          python3 .github/scripts/bandit_to_sarif.py reports/bandit.json reports/bandit.sarif

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/bandit.sarif
          category: bandit

  # ---------- 3. Backend dependency CVE scan ----------
  pip-audit:
    name: pip-audit (backend deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Run pip-audit (blocking — gate flipped in PR-G1)
        working-directory: backend
        run: |
          mkdir -p ../reports
          pip-audit --strict --disable-pip --no-deps \
                    --requirement requirements.txt \
                    --format json \
                    --output ../reports/pip-audit.json
          echo "::notice::pip-audit passed — no known CVEs in backend deps."

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: reports/pip-audit.json
          if-no-files-found: ignore

  # ---------- 4. Frontend dependency CVE scan ----------
  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm shim)
        run: corepack enable

      - name: npm audit (blocking — gate flipped in PR-G2 via audit-ci)
        working-directory: frontend
        run: |
          mkdir -p ../reports
          # audit-ci: IBM-grade wrapper around pnpm/npm/yarn audit with allowlist
          # support (npm-audit --audit-level has no per-advisory allowlist).
          # Threshold: critical only. Allowlist in audit-ci.jsonc gates the 5
          # known-deferred CVEs (next 14.x, tinypool false positives). Override
          # in pnpm-workspace.yaml clears the rest (postcss, postcss-selector-
          # parser, glob). Tracked in Issue #30 (Phase 1.5A2).
          pnpm dlx audit-ci@^7 --config ./audit-ci.jsonc --output-format json > ../reports/npm-audit.json
          echo "::notice::npm audit passed (critical-only, 5 known-deferred CVEs allowlisted)."

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: reports/npm-audit.json
          if-no-files-found: ignore

  # ---------- 5. Filesystem + Dockerfile vulnerability scan ----------
  trivy:
    name: trivy (filesystem + Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run trivy filesystem scan (blocking — gate flipped in PR-G2)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "reports/trivy-fs.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          ignorefile: ".trivyignore"
          exit-code: "1"
          hide-progress: true
        # exit-code: "1" = blocking (PR-G2). The .trivyignore allowlists
        # 13 next.js 14.x CVEs (fix requires next 15.5.16+ / 15.5.24+ = MAJOR,
        # deferred to v0.3.0 Issue #38) and 2 postcss 8.4.31 transitive CVEs
        # that are already fixed via the postcss override in
        # frontend/pnpm-workspace.yaml but still appear in the stale
        # frontend/package-lock.json (npm format, kept for fallback).
        # Image scans below remain advisory (exit-code: 0) — separate PR
        # will flip them after triage.

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-fs.sarif
          category: trivy-fs

      # ---------- 5b. Container image scans (Phase 1.5 (3/3)) ----------
      # Build the Docker images with buildx, then scan with trivy.
      # Surfaces OS-level CVEs (glibc, openssl, base image packages)
      # that filesystem scan cannot detect.

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: recon-backend:scan
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "recon-backend:scan"
          format: "sarif"
          output: "reports/trivy-backend-image.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"
          hide-progress: true
        # exit-code: "0" = advisory. Will be tightened once we triage
        # the OS-level CVEs that surface in the base images (likely python:3.11-slim).

      - name: Upload SARIF backend image
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-backend-image.sarif
          category: trivy-backend-image

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: recon-frontend:scan
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan frontend image with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "image"
          image-ref: "recon-frontend:scan"
          format: "sarif"
          output: "reports/trivy-frontend-image.sarif"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"
          hide-progress: true

      - name: Upload SARIF frontend image
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-frontend-image.sarif
          category: trivy-frontend-image
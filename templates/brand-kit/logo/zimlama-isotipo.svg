<?xml version="1.0" encoding="UTF-8"?>
<!--
  zimlama isotipo — GIR-style robot head with magnifying glass.
  Original design. Apache-2.0.
  64×64 viewBox. Uses currentColor for primary fill, supports theming.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>zimlama</title>
  <desc>Robot head with magnifying glass as the eye. Original zimlama brand mark.</desc>

  <!-- Antenna -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="4" r="3" fill="#c11b05"/>

  <!-- Head (rounded rectangle) -->
  <rect x="8" y="14" width="48" height="42" rx="8" ry="8"
        fill="currentColor" stroke="#0a0a0a" stroke-width="1.5"/>

  <!-- Magnifying glass (the "eye") -->
  <circle cx="32" cy="30" r="9" fill="#faf8f6" stroke="#0a0a0a" stroke-width="2"/>
  <line x1="38" y1="36" x2="44" y2="42" stroke="#0a0a0a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Mouth -->
  <line x1="26" y1="50" x2="38" y2="50" stroke="#0a0a0a" stroke-width="1.5" stroke-linecap="round"/>
</svg>

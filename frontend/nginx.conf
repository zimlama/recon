# Next.js nginx config for production
server {
    listen 80;
    server_name _;
    root /app;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:8000 ws: wss:;" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Next.js static assets
    location /_next/static/ {
        alias /app/.next/static/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /_next/image {
        alias /app/.next/image/;
        expires 1y;
        access_log off;
    }

    # Public files
    location /public/ {
        alias /app/public/;
        expires 1y;
        access_log off;
    }

    # API proxy → backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;  # for long AI validation
        proxy_send_timeout 300s;
    }

    # Health endpoint
    location /health {
        access_log off;
        return 200 "ok\n";
    }

    # Everything else → Next.js
    location / {
        try_files $uri $uri/ /index.html;
    }
}
